run_name: nwm_cdit_b

# training setup
results_dir: logs
weights_dir: weights/checkpoints
artifact_dir: artifacts/bulk/train
train: True
batch_size: 16
num_workers: 12
model: CDiT-B/2
lr: 8e-5

# normalization for the action space
normalize: True
grad_clip_val: 10.0
context_size: 4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: -64
  max_dist_cat: 64

# action output params
len_traj_pred: 64

# dataset specific parameters
image_size: 224
# image_size: 128
datasets:
  recon:
    data_folder: datasets/recon
    train: data/splits/recon/train/ # path to train folder with traj_names.txt
    test: data/splits/recon/test/ # path to test folder with traj_names.txt
    goals_per_obs: 4
  tartan_drive:
    data_folder: datasets/tartan_320
    train: data/splits/tartan_drive/train/
    test: data/splits/tartan_drive/test/
    goals_per_obs: 4
  sacson:
    data_folder: datasets/sacson_320
    train: data/splits/sacson/train
    test: data/splits/sacson/test
    goals_per_obs: 4
  scand:
    data_folder: datasets/scand_320
    train: data/splits/scand/train
    test: data/splits/scand/test
    goals_per_obs: 4
