run_name: nwm_cdit_b_recon_raw_text_dense

# training setup
results_dir: logs
weights_dir: weights/checkpoints
artifact_dir: artifacts/bulk/train
train: True
batch_size: 16
num_workers: 12
model: CDiT-B/2
lr: 8e-5
from_checkpoint: 0

normalize: True
grad_clip_val: 10.0
context_size: 4

distance:
  min_dist_cat: -64
  max_dist_cat: 64

len_traj_pred: 64

image_size: 224
checkpoint_strict: True
checkpoint_ignore_shape_mismatch: False
checkpoint_ignore_keys: []
load_training_state: True
text_conditioning:
  enabled: True
  embedding_root: datasets/derived/phase1_text_embeds_dense/recon_all_raw_rel
  condition_source: current
  text_dim: 0
datasets:
  recon:
    data_folder: datasets/recon_raw/recon_release
    train: data/splits/recon/train/
    test: data/splits/recon/test/
    goals_per_obs: 4
